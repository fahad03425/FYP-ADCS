{% extends "base.html" %}
{% load static %}

{% block mtitle %}
Booking Form
{% endblock %}

{% block content %}
<div class="bg-blue-100 min-h-screen flex lg:items-center lg:justify-center p-4">
    <!-- Booking Form -->
    <div id="bookingForm" class="bg-white p-4 sm:p-6 md:p-8 rounded-lg shadow-md w-full max-w-xs sm:max-w-sm md:max-w-md">
        <h2 class="text-lg sm:text-xl font-bold mb-4 text-center">Confirm Details for Booking</h2>
        <form id="form">
            <div class="mb-4">
                <label for="phone" class="block mb-1 text-base sm:text-lg">Phone Number</label>
                <input
                    type="text"
                    id="phone"
                    class="w-full border border-gray-300 p-2 sm:p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                />
            </div>
            <div class="flex justify-center">
                <button
                    type="submit"
                    class="bg-blue-500 text-white font-bold text-base sm:text-lg py-2 px-4 sm:py-3 sm:px-6 rounded hover:bg-blue-600"
                >
                    Confirm Booking
                </button>
            </div>
        </form>
    </div>

    <!-- Thank You Message (Initially Hidden) -->
    <div id="thankYouMessage" class="hidden bg-white p-4 sm:p-6 md:p-8 rounded-lg shadow-md w-full max-w-xs sm:max-w-sm md:max-w-md text-center">
        <h2 class="text-lg sm:text-xl md:text-2xl font-bold mb-4">Thank you for booking!</h2>
        <div class="flex justify-center mb-4 sm:mb-6">
            <img
                src="{% static 'check.png' %}"
                alt="check mark"
                class="w-20 h-20 sm:w-28 sm:h-28 md:w-36 md:h-36"
            />
        </div>
        <p class="font-medium text-base sm:text-lg">Seller will contact you within 2 hours</p>
        <button
            class="bg-blue-500 text-white py-2 px-4 sm:py-3 sm:px-6 rounded mt-4 hover:bg-blue-600"
            onclick="location.reload()"
        >
            Close
        </button>
    </div>
</div>

<script>
    // JavaScript to handle form submission and show thank you message
    document.getElementById('form').addEventListener('submit', function (event) {
        event.preventDefault(); // Prevent the form from submitting normally

        // Hide the booking form
        document.getElementById('bookingForm').classList.add('hidden');

        // Show the thank you message
        document.getElementById('thankYouMessage').classList.remove('hidden');
    });
</script>
{% endblock %}
